name: Deploy Internet Sucks to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check game JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit("Module script not found")
          Path("/tmp/internet-sucks-check.mjs").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/internet-sucks-check.mjs
      - name: Validate Firebase rules JSON
        run: python -m json.tool database.rules.json > /dev/null
      - name: Sanity-check game flow configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")
          for required in ('const TOTAL_ROUNDS = 4;', 'const PHASE_TIMEOUTS = { answering: 120000, rewriting: 120000, voting: 60000 };', 'function handleTimeoutAction', 'async function resumeHostAfterReconnect'):
              if required not in html:
                  raise SystemExit(f"Missing required game-flow code: {required}")
          if "Five rounds, then the final leaderboard." in readme:
              raise SystemExit("README still advertises five rounds")
          import re
          ids = set(re.findall(r'\\bid="([^"]+)"', html))
          references = set(re.findall(r'\\$\("([^"]+)"\)', html))
          missing_ids = sorted(references - ids)
          if missing_ids:
              raise SystemExit("JavaScript references missing HTML ids: " + ", ".join(missing_ids))
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
